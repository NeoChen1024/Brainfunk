# thaliaarchi/bfcorpus, a curated collection with one directory per author, as a submodule.
#
# Licensing: "Programs are licensed by their respective owners. See the README.md file in
# each sub-directory for more information." Each entry keeps the License: line of the
# nearest README.md verbatim as license_note; many say "None". The collection's own
# commentary is CC BY-SA 4.0 (LICENSE).
#
# Entries marked reviewed = false were drafted by a tool: their halts, role and origin are
# guesses. Families follow bfcorpus's author directories, corrected where the evidence says
# someone else wrote the program; see the notes on those entries.
#
# Drafted by tools/corpus/corpus.py draft from 3rdparty/bfcorpus.
# halts was guessed from one run on empty input with a 5 s limit.

[source]
name = "bfcorpus"
submodule = "3rdparty/bfcorpus"
license = "NOASSERTION"
license_files = ["LICENSE", "README.md"]
url = "https://github.com/thaliaarchi/bfcorpus"

[defaults]
origin = "unknown"
role = "workload"
cell_bits = 8

