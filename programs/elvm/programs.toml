# ELVM's test programs compiled to Brainfuck. Generated, not committed: build them with
#
#   tools/corpus/build-elvm.sh WORKDIR
#
# which patches a copy of 3rdparty/ELVM with bf-stack-top.patch (the stack starts at word
# 21248, so programs fit a 64 KiB tape), builds every test, and installs the files below
# into out/, checking each blake3. tools/corpus/check-elvm.py WORKDIR rechecks the limits.
#
# Listed here: the outputs that fit 1M bitcode words at -O2 and print what ELVM's own
# interpreter prints for the same inputs. Left out, as programs/WANTED.md explains: eli.c
# (3.4M cells: its heap grows past the stack), 8cc.c (2.9M words) and elc.c (6.3M words).
#
# These outputs share a large runtime, so they look alike to the static duplicate check;
# they differ in what the compiled C program does at run time.

[source]
name = "elvm"
url = "https://github.com/shinh/ELVM"
license = "MIT"
license_files = ["../../3rdparty/ELVM/LICENSE"]
generated = true
build = "tools/corpus/build-elvm.sh WORKDIR"
generator = "3rdparty/ELVM at 020d1d8cfead001e9866947d7072021ad22886da, with bf-stack-top.patch"

[defaults]
author = "Shinichiro Hamaji and ELVM contributors"
family = "elvm"
origin = "compiled"
cell_bits = 8
eof = ["0"]

