# Robert de Bath's Brainfuck repository, as a submodule. Its testing/ directory collects
# third-party programs next to his own test programs.
#
# Licensing, from testing/Copyrights: the programs Robert de Bath wrote are public domain or
# CC0, and are marked license = "CC0-1.0" below. The others are by third parties, or
# mechanical translations of their work, and keep whatever terms their authors gave them;
# the author is recorded where the file names one. The repository itself is GPL-2.0.
#
# Observations come from running brainfunk -O3 with 8-bit cells, EOF as 0, and a 60 s limit.
# Expected outputs that only match with wider cells say so in expect_cell_bits.

[source]
name = "rdebath-Brainfuck"
url = "https://github.com/rdebath/Brainfuck"
submodule = "3rdparty/rdebath-Brainfuck"
license = "GPL-2.0-only"
license_files = ["LICENSE", "testing/Copyrights"]

[defaults]
origin = "handwritten"
role = "workload"
halts = "always"
cell_bits = 8

# ---------------------------------------------------------------- Robert de Bath's own

[[program]]
file = "testing/al-count-0.b"
family = "rdebath"
license = "CC0-1.0"
notes = "Binary counter benchmark, smallest size."

